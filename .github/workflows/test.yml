name: test

# The agentic-os plugin runs on Windows and macOS laptops (and Linux boxes, whose
# case-sensitive file system catches its own class of bugs), so every change is
# tested on all three: the plugin's scripts, and the dashboard engine's server,
# end-to-end and UI tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: plugins/agentic-os/engine/package-lock.json
      - name: Git identity (the tests make throwaway repos and worktrees)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Plugin scripts
        run: node --test "plugins/agentic-os/scripts/test/*.test.mjs"
      - name: Engine
        working-directory: plugins/agentic-os/engine
        run: |
          npm ci
          npm run typecheck
          npm test
